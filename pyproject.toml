[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "theforge"
version = "0.1.0"
description = "Local-first control plane that discovers, routes and governs specialist Forges."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "jsonschema>=4.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "build>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
theforge = "theforge.cli.main:main"
forge = "theforge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/theforge"]

[tool.hatch.build.targets.sdist]
# The adapters are separate distributions (adapters/*/pyproject.toml), never part of theforge.
exclude = ["/adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not real_provider' --basetemp=.pytest_tmp"
# Categories are applied per file by tests/conftest.py FILE_MARKERS (unmapped file = error).
markers = [
    "unit: pure in-process logic, no subprocess",
    "contract: contract/schema/protocol shape tests",
    "integration: multiple components, subprocess providers or filesystem workspaces",
    "e2e: real CLI end to end in a subprocess",
    "slow: builds packages or needs network (fresh install gate)",
    "security: hostile inputs, secrets, isolation and trust boundaries",
    "real_provider: needs real external Forges (separate CI workflow)",
    "allow_network: releases the session-level network block for one test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src:adapters/sparkforge/src:adapters/apiforge/src"
files = ["src", "scripts", "adapters/sparkforge/src", "adapters/apiforge/src"]

[[tool.mypy.overrides]]
# The specialists are installed only in their own interpreters, never in the core env.
module = ["sparkforge.*", "apiforge.*"]
ignore_missing_imports = true
