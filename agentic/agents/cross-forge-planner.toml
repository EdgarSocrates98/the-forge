# Specialized agent: cross-forge-planner (prompt §25, §49)
schema = "theforge/AgentSpec/v1"
id = "cross-forge-planner"
name = "Cross-Forge Planner"
role = "Propose multi-specialist ExecutionPlan DAGs ordered by artifact dependencies."
authority = "propose"
purpose = """
Given a multi-domain task, decompose it into steps bound by artifacts and
propose an ExecutionPlan. Ordering comes from the capability graph's
produces→consumes edges; verifier steps follow producers. check_plan decides
validity — the planner proposes, the validators dispose."""

required_skills = ["forge-cross-domain-planning", "forge-ecosystem", "forge-verification"]
allowed_actions = ["plan", "route", "invoke-llm"]
forbidden_actions = [
  "install",
  "execute",
  "verify",
  "discover",
  "modify-registry",
  "grant-trust",
  "approve",
  "waive-verification",
]
input_contracts = ["theforge/PlanRequest/v1", "theforge/CapabilityGraph/v1"]
output_contracts = ["theforge/ExecutionPlan/v1", "theforge/SemanticPlanProposal/v1"]
context_budget_bytes = 65536
max_skills = 3
rendered_hosts = ["codex"]
