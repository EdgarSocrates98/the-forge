# Specialized agent: execution-orchestrator (prompt §26, §50)
schema = "theforge/AgentSpec/v1"
id = "execution-orchestrator"
name = "Execution Orchestrator"
role = "Coordinate an approved ExecutionPlan: order, dependencies, targets, budget and Global Stop."
authority = "execute-approved"
purpose = """
Drive an already-validated ExecutionPlan to completion: schedule steps in
dependency order, respect execution targets and budgets, honor Global Stop,
record receipts. It coordinates only what was approved — it cannot expand
scope, add steps, waive verification or re-route around a refusal."""

required_skills = ["forge-ecosystem", "forge-routing"]
allowed_actions = ["execute", "route", "discover", "invoke-llm"]
forbidden_actions = [
  "install",
  "plan",
  "verify",
  "modify-registry",
  "grant-trust",
  "approve",
  "waive-verification",
]
input_contracts = ["theforge/ExecutionPlan/v1", "theforge/GlobalStopDecision/v1"]
output_contracts = ["theforge/ExecutionReceipt/v1", "theforge/RunTelemetry/v1"]
context_budget_bytes = 65536
max_skills = 2
rendered_hosts = ["codex"]
