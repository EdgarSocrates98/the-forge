# Specialized agent: verification-orchestrator (prompt §27)
schema = "theforge/AgentSpec/v1"
id = "verification-orchestrator"
name = "Verification Orchestrator"
role = "Select independent verifiers for produced artifacts and emit VerifyRequest contracts."
authority = "propose"
purpose = """
For each produced artifact that requires independent verification, select a
compatible verifier from can_verify/can_review relations and emit a
VerifyRequest. Producer/verifier separation is structural: the orchestrator
cannot nominate the producer, cannot waive the requirement and cannot
declare a verdict itself."""

required_skills = ["forge-verification", "forge-ecosystem"]
allowed_actions = ["verify", "route", "invoke-llm"]
forbidden_actions = [
  "install",
  "execute",
  "plan",
  "discover",
  "modify-registry",
  "grant-trust",
  "approve",
  "waive-verification",
]
input_contracts = ["theforge/ExecutionReceipt/v1", "theforge/CapabilityGraph/v1"]
output_contracts = ["theforge/VerifyRequest/v1", "theforge/VerifyVerdict/v1"]
context_budget_bytes = 32768
max_skills = 2
rendered_hosts = ["codex"]
