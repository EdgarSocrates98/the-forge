# Pull-request gate (requirements 7.1-7.4; ADR 0011 for the support matrix).
# macOS and real providers run in separate, non-blocking workflows (7.7, 7.8).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # bash on every runner (Git Bash on Windows): same syntax, and dist/*.whl is expanded.
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable, dev extras, adapters)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev] -e ./adapters/sparkforge_aws -e ./adapters/apiforge

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy

      - name: Schema parity
        run: |
          python -m theforge.contracts.schema schemas
          git diff --exit-code -- schemas
          test -z "$(git status --porcelain --untracked-files=all -- schemas)"
          python -m pytest -p no:cacheprovider tests/test_schemas.py

      - name: Offline test suite
        run: python -m pytest -m "not slow and not real_provider"

  package:
    name: package (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"

      - name: Build sdist and wheel
        run: python -m build

      - name: Gate - zero runtime dependencies
        run: python scripts/ci/check_zero_deps.py dist/*.whl

      - name: Gate - fresh install of the wheel
        run: python scripts/ci/fresh_install.py dist/*.whl
