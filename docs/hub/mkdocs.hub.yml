# Optional Learning Hub site — dev-only.
# Build:  pip install mkdocs-material
#         mkdocs build -f docs/hub/mkdocs.hub.yml
# The hub works as plain markdown without any build (local-first).
site_name: Forge Learning Hub
site_description: Ecosystem discovery layer — each forge owns its docs.
docs_dir: .
site_dir: ../../.site-hub
theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
plugins:
  - search
nav:
  - Start Here: index.md
  - Which Forge Should I Use?: which-forge.md
  - Install & Configure: install.md
  - CLI & TUI: cli-tui.md
  - AI Hosts: hosts.md
  - Agents & Skills: agents-skills.md
  - MCP: mcp.md
  - Recipes: recipes.md
  - Graphfy & Graph Studio: graphfy.md
  - Troubleshooting: troubleshooting.md
  - Advanced Reference: advanced.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
