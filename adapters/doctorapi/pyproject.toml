[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "theforge-doctorapi-adapter"
version = "0.3.0"
description = "Forge Protocol v1 provider adapter that exposes Forge Doctor API to The Forge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/theforge_doctorapi"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"
