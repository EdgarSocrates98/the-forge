openapi: 3.1.0
info:
  title: Daily Orders API
  version: 1.0.0
paths:
  /daily-orders:
    get:
      operationId: listDailyOrders
      parameters:
        - name: order_date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Daily orders of one date
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyOrder"
  /daily-orders/{order_id}:
    get:
      operationId: getDailyOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One daily order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyOrder"
        "404":
          description: Not found
components:
  schemas:
    DailyOrder:
      type: object
      required: [order_id, customer_id, order_date, total]
      properties:
        order_id:
          type: string
        customer_id:
          type: string
        order_date:
          type: string
          format: date
        total:
          type: number
